<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos | Parking Tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #073b73;
        }
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .tarjeta-foto {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .tarjeta-foto img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .tarjeta-foto p {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Parking Tech - Capturas del Sistema</h1>
    <p>Demostración visual de la aplicación y sus funcionalidades.</p>

    <div class="galeria">
        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH.jpg" alt="Pantalla de Inicio">
            <p>Pantalla Principal De Login</p>
        </div>

        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH2.jpg" alt="Mapa de Disponibilidad">
            <p>Pantalla para agregar vehiculos</p>
        </div>

        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH3.jpg" alt="Control de Barrera">
            <p>Formulario para agregar vehiculos</p>
        </div>

        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH4.jpg" alt="Control de Barrera">
            <p>Panel de disponibilidad</p>
        </div>

        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH5.jpg" alt="Control de Barrera">
            <p>Formulario para realizar una reserva</p>
        </div>

        <div class="tarjeta-foto">
            <img src="fotos/PARKINGTECH6.jpg" alt="Control de Barrera">
            <p>Formulario de pago de reserva</p>
        </div>
    </div>

</body>
</html>
